<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>極簡油耗追蹤</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 載入 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #0f172a; /* Tailwind slate-900 */
      color: #f8fafc; /* Tailwind slate-50 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* 隱藏卷軸但保持可滾動 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 大字體輸入框設定 */
    input {
      font-size: 1.125rem !important; /* text-lg */
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
  </style>
</head>
<body class="flex justify-center min-h-screen">
  <div id="root" class="w-full max-w-md bg-slate-900 min-h-screen shadow-2xl relative flex flex-col overflow-hidden sm:border-x sm:border-slate-800"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 圖示 (Icons) ---
    const Icons = {
      Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
      List: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
      Chart: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
      Settings: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Plus: () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 4v16m8-8H4" /></svg>,
      Droplet: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>,
      Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
    };

    // --- 圖表元件 (Chart.js 封裝) ---
    function LineChart({ data, label, borderColor, bgColor }) {
      const canvasRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = canvasRef.current.getContext('2d');
        
        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map(d => d.label),
            datasets: [{
              label: label,
              data: data.map(d => d.value),
              borderColor: borderColor,
              backgroundColor: bgColor,
              borderWidth: 3,
              tension: 0.4,
              fill: true,
              pointBackgroundColor: borderColor,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
              y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
            }
          }
        });
        return () => { if(chartInstance.current) chartInstance.current.destroy(); };
      }, [data, label, borderColor, bgColor]);

      return <div className="h-48 w-full"><canvas ref={canvasRef}></canvas></div>;
    }

    // --- 主程式 APP ---
    function App() {
      // 狀態管理
      const [view, setView] = useState('dashboard');
      const [toast, setToast] = useState(null);
      
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('fuel_settings');
        return saved ? JSON.parse(saved) : { isSetupComplete: false, tankCapacity: '', initialOdometer: '' };
      });

      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('fuel_records');
        return saved ? JSON.parse(saved) : [];
      });

      // 自動存檔
      useEffect(() => { localStorage.setItem('fuel_settings', JSON.stringify(settings)); }, [settings]);
      useEffect(() => { localStorage.setItem('fuel_records', JSON.stringify(records)); }, [records]);

      // --- 核心邏輯：計算所有衍生數據 ---
      const derivedRecords = useMemo(() => {
        const sorted = [...records].sort((a, b) => Number(a.odometer) - Number(b.odometer));
        return sorted.map((r, i) => {
          const prevOdo = i === 0 ? Number(settings.initialOdometer) : Number(sorted[i-1].odometer);
          const distance = Number(r.odometer) - prevOdo;
          const kmPerL = distance / Number(r.volume);
          const unitPrice = Number(r.cost) / Number(r.volume);
          return { ...r, distance, kmPerL, unitPrice };
        }).reverse(); // 顯示時最新在上
      }, [records, settings.initialOdometer]);

      // --- 儀表板統計數據 ---
      const stats = useMemo(() => {
        if (derivedRecords.length === 0) return null;
        
        const currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM
        const lastMonthDate = new Date();
        lastMonthDate.setMonth(lastMonthDate.getMonth() - 1);
        const lastMonth = lastMonthDate.toISOString().slice(0, 7);

        const currentMonthRecords = derivedRecords.filter(r => r.date.startsWith(currentMonth));
        const lastMonthRecords = derivedRecords.filter(r => r.date.startsWith(lastMonth));

        const thisMonthCost = currentMonthRecords.reduce((sum, r) => sum + Number(r.cost), 0);
        const lastMonthCost = lastMonthRecords.reduce((sum, r) => sum + Number(r.cost), 0);
        
        // 總平均油耗 (排除第一筆可能不準確的資料，如果資料足夠的話)
        const validRecords = derivedRecords.filter(r => r.distance > 0);
        const avgKmPerL = validRecords.length > 0 
          ? validRecords.reduce((sum, r) => sum + r.kmPerL, 0) / validRecords.length 
          : 0;

        // 預測續航力：油箱容量 * 平均油耗
        const estimatedRange = Number(settings.tankCapacity) * avgKmPerL;

        return { thisMonthCost, lastMonthCost, avgKmPerL, estimatedRange };
      }, [derivedRecords, settings.tankCapacity]);

      // --- 顯示 Toast 提示 ---
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // --- 元件：引導設定 (Onboarding) ---
      if (!settings.isSetupComplete) {
        return (
          <div className="flex-1 flex flex-col justify-center p-6 space-y-8 bg-slate-900 text-white">
            <div className="text-center space-y-3">
              <div className="w-20 h-20 bg-blue-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/30">
                <Icons.Droplet />
              </div>
              <h1 className="text-3xl font-bold tracking-wider">油耗追蹤設定</h1>
              <p className="text-slate-400 text-lg">第一次使用，請輸入車輛的基本資料以確保計算準確。</p>
            </div>
            
            <div className="space-y-6">
              <div className="space-y-2">
                <label className="text-lg font-medium text-slate-300">油箱總容量 (公升)</label>
                <input type="number" placeholder="例如: 50" value={settings.tankCapacity} 
                  onChange={e => setSettings({...settings, tankCapacity: e.target.value})}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-5 py-4 text-xl focus:outline-none focus:border-blue-500 transition" />
              </div>
              <div className="space-y-2">
                <label className="text-lg font-medium text-slate-300">儀表板目前總里程 (km)</label>
                <input type="number" placeholder="例如: 15000" value={settings.initialOdometer} 
                  onChange={e => setSettings({...settings, initialOdometer: e.target.value})}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-5 py-4 text-xl focus:outline-none focus:border-blue-500 transition" />
              </div>
              <button 
                onClick={() => {
                  if(!settings.tankCapacity || !settings.initialOdometer) return alert("請填寫完整資訊");
                  setSettings({...settings, isSetupComplete: true});
                }}
                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xl py-4 rounded-xl shadow-lg transition">
                開始記錄
              </button>
            </div>
          </div>
        );
      }

      // --- 元件：新增紀錄表單 ---
      const AddRecordView = () => {
        const today = new Date().toISOString().split('T')[0];
        const [form, setForm] = useState({ date: today, volume: '', cost: '', odometer: '' });

        const handleSave = () => {
          if(!form.volume || !form.cost || !form.odometer) return alert("請填寫所有欄位！");
          
          const newOdometer = Number(form.odometer);
          const latestOdo = derivedRecords.length > 0 ? derivedRecords[0].odometer : Number(settings.initialOdometer);
          
          if(newOdometer <= latestOdo) {
            return alert(`錯誤：新里程(${newOdometer}) 必須大於上次里程(${latestOdo})`);
          }

          const newRecord = { ...form, id: Date.now().toString() };
          
          // 計算本次油耗並與上次比較
          const distance = newOdometer - latestOdo;
          const currentKmPerL = distance / Number(form.volume);
          let msg = `儲存成功！本次油耗: ${currentKmPerL.toFixed(2)} km/L`;

          if (derivedRecords.length > 0) {
            const prevKmPerL = derivedRecords[0].kmPerL;
            const diffPercent = ((currentKmPerL - prevKmPerL) / prevKmPerL) * 100;
            if (diffPercent > 0) {
              msg += ` (比上次好 ${diffPercent.toFixed(1)}% 🟢)`;
            } else if (diffPercent < 0) {
              msg += ` (比上次差 ${Math.abs(diffPercent).toFixed(1)}% 🔴)`;
            } else {
              msg += ` (與上次持平 ⚪)`;
            }
          }

          setRecords([...records, newRecord]);
          showToast(msg);
          setView('dashboard');
        };

        return (
          <div className="flex-1 overflow-y-auto p-6 space-y-6 pb-24">
            <div className="flex items-center justify-between mb-2">
              <h2 className="text-2xl font-bold">新增加油記錄</h2>
              <button onClick={() => setView('dashboard')} className="text-slate-400 p-2">取消</button>
            </div>
            
            <div className="space-y-5">
              <div className="space-y-2">
                <label className="text-lg text-slate-300">日期</label>
                <input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} 
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-xl text-white" />
              </div>
              <div className="space-y-2">
                <label className="text-lg text-slate-300">加油量 (公升)</label>
                <input type="number" step="0.01" placeholder="例如: 35.5" value={form.volume} onChange={e => setForm({...form, volume: e.target.value})} 
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-xl text-white" />
              </div>
              <div className="space-y-2">
                <label className="text-lg text-slate-300">總金額 ($)</label>
                <input type="number" placeholder="例如: 1000" value={form.cost} onChange={e => setForm({...form, cost: e.target.value})} 
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-xl text-white" />
              </div>
              <div className="space-y-2">
                <label className="text-lg text-slate-300">儀表板目前總里程 (km)</label>
                <div className="text-sm text-slate-500 mb-1">上次里程: {derivedRecords.length > 0 ? derivedRecords[0].odometer : settings.initialOdometer} km</div>
                <input type="number" placeholder="輸入最新總里程" value={form.odometer} onChange={e => setForm({...form, odometer: e.target.value})} 
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-xl text-white" />
              </div>
              
              <button onClick={handleSave} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xl py-4 rounded-xl shadow-lg mt-4 transition">
                儲存記錄
              </button>
            </div>
          </div>
        );
      };

      return (
        <div className="flex flex-col h-full bg-slate-900 text-slate-100">
          
          {/* 頂部通知 Toast */}
          {toast && (
            <div className="absolute top-4 left-4 right-4 bg-slate-800 border border-slate-700 text-white p-4 rounded-xl shadow-2xl z-50 flex items-center space-x-3 transition-all animate-fade-in-down">
              <div className="text-emerald-400"><Icons.Droplet /></div>
              <div className="text-lg font-medium">{toast.message}</div>
            </div>
          )}

          {/* 主要內容區 */}
          <div className="flex-1 overflow-y-auto no-scrollbar pb-24">
            
            {view === 'dashboard' && (
              <div className="p-6 space-y-6">
                <h1 className="text-3xl font-bold mb-2">儀表板</h1>
                
                {stats ? (
                  <>
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                        <div className="text-slate-400 text-sm font-medium mb-1">本月花費</div>
                        <div className="text-3xl font-black text-white">${stats.thisMonthCost.toLocaleString()}</div>
                        <div className="text-sm mt-2 text-slate-500">上月: ${stats.lastMonthCost.toLocaleString()}</div>
                      </div>
                      <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                        <div className="text-slate-400 text-sm font-medium mb-1">平均油耗</div>
                        <div className="text-3xl font-black text-emerald-400">{stats.avgKmPerL.toFixed(1)}</div>
                        <div className="text-sm mt-2 text-slate-500">km / L</div>
                      </div>
                    </div>

                    <div className="bg-gradient-to-r from-blue-900/50 to-indigo-900/50 border border-blue-800/50 p-6 rounded-2xl relative overflow-hidden">
                      <div className="relative z-10">
                        <div className="text-blue-300 text-lg font-medium mb-2">滿油預估續航力</div>
                        <div className="text-5xl font-black text-white">{stats.estimatedRange.toFixed(0)} <span className="text-xl font-medium text-blue-200">km</span></div>
                        <div className="text-sm mt-3 text-blue-300/70">依據您的油箱 {settings.tankCapacity}L 與平均油耗計算</div>
                      </div>
                      <div className="absolute right-[-20px] bottom-[-20px] text-blue-500/20 w-32 h-32"><Icons.Droplet /></div>
                    </div>

                    <div className="pt-2">
                      <div className="flex justify-between items-end mb-4">
                        <h2 className="text-xl font-bold">最近記錄</h2>
                        <button onClick={() => setView('history')} className="text-blue-400 text-lg">查看全部</button>
                      </div>
                      <div className="space-y-3">
                        {derivedRecords.slice(0, 3).map(r => (
                          <div key={r.id} className="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                            <div>
                              <div className="font-bold text-lg">{r.date}</div>
                              <div className="text-slate-400 text-base">{r.distance} km跑了 {Number(r.volume).toFixed(1)}L</div>
                            </div>
                            <div className="text-right">
                              <div className="font-bold text-emerald-400 text-xl">{r.kmPerL.toFixed(1)} km/L</div>
                              <div className="text-slate-400 text-sm">${r.unitPrice.toFixed(1)}/L</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </>
                ) : (
                  <div className="bg-slate-800 border border-slate-700 p-8 rounded-2xl text-center text-slate-400 mt-10">
                    <p className="text-xl mb-4">目前還沒有加油記錄</p>
                    <p>點擊下方的「+」開始記錄您的第一筆油耗吧！</p>
                  </div>
                )}
              </div>
            )}

            {view === 'history' && (
              <div className="p-6 space-y-4">
                <h1 className="text-3xl font-bold mb-6">歷史記錄</h1>
                {derivedRecords.length === 0 ? (
                  <div className="text-center text-slate-500 py-10 text-xl">無記錄</div>
                ) : (
                  <div className="space-y-4">
                    {derivedRecords.map(r => (
                      <div key={r.id} className="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm relative group overflow-hidden">
                        <div className="flex justify-between items-start mb-3 border-b border-slate-700 pb-3">
                          <div>
                            <div className="font-bold text-xl text-white">{r.date}</div>
                            <div className="text-slate-400 mt-1">總里程: {r.odometer} km</div>
                          </div>
                          <button onClick={() => {
                            if(confirm('確定要刪除這筆記錄嗎？')) {
                              setRecords(records.filter(rec => rec.id !== r.id));
                            }
                          }} className="text-red-400/80 hover:text-red-400 p-2 bg-red-400/10 rounded-lg">
                            <Icons.Trash />
                          </button>
                        </div>
                        <div className="grid grid-cols-3 gap-2 text-center">
                          <div>
                            <div className="text-slate-500 text-sm">油耗</div>
                            <div className="font-bold text-emerald-400 text-xl">{r.kmPerL.toFixed(1)}</div>
                          </div>
                          <div className="border-l border-r border-slate-700">
                            <div className="text-slate-500 text-sm">單價</div>
                            <div className="font-bold text-blue-400 text-xl">${r.unitPrice.toFixed(1)}</div>
                          </div>
                          <div>
                            <div className="text-slate-500 text-sm">總花費</div>
                            <div className="font-bold text-white text-xl">${r.cost}</div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {view === 'stats' && (
              <div className="p-6 space-y-8">
                <h1 className="text-3xl font-bold">統計與分析</h1>
                
                {derivedRecords.length >= 2 ? (
                  <>
                    <div className="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                      <h3 className="text-lg font-bold text-slate-300 mb-4">油耗趨勢 (km/L)</h3>
                      <LineChart 
                        data={[...derivedRecords].reverse().map(r => ({ label: r.date.substring(5), value: r.kmPerL.toFixed(1) }))} 
                        label="油耗 km/L" borderColor="#34d399" bgColor="rgba(52, 211, 153, 0.1)" 
                      />
                    </div>

                    <div className="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                      <h3 className="text-lg font-bold text-slate-300 mb-4">油價走勢 ($/L)</h3>
                      <LineChart 
                        data={[...derivedRecords].reverse().map(r => ({ label: r.date.substring(5), value: r.unitPrice.toFixed(1) }))} 
                        label="單價 $/L" borderColor="#60a5fa" bgColor="rgba(96, 165, 250, 0.1)" 
                      />
                    </div>
                  </>
                ) : (
                  <div className="text-center text-slate-500 py-10 text-xl">需要至少兩筆記錄才能顯示圖表</div>
                )}
              </div>
            )}

            {view === 'settings' && (
              <div className="p-6 space-y-6">
                <h1 className="text-3xl font-bold mb-6">設定</h1>
                <div className="space-y-6">
                  <div className="space-y-3 bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                    <label className="text-xl font-medium text-slate-300 block">修改油箱容量 (L)</label>
                    <input type="number" value={settings.tankCapacity} 
                      onChange={e => setSettings({...settings, tankCapacity: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-xl text-white focus:border-blue-500" />
                  </div>
                  <div className="space-y-3 bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                    <label className="text-xl font-medium text-slate-300 block">初始里程 (km)</label>
                    <div className="text-slate-500 text-sm mb-2">修改初始里程會影響第一筆油耗的計算</div>
                    <input type="number" value={settings.initialOdometer} 
                      onChange={e => setSettings({...settings, initialOdometer: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-xl text-white focus:border-blue-500" />
                  </div>
                </div>
              </div>
            )}

            {view === 'add' && <AddRecordView />}

          </div>

          {/* 底部導覽列 */}
          {view !== 'add' && (
            <div className="absolute bottom-0 w-full max-w-md bg-slate-800/95 border-t border-slate-700 backdrop-blur-md pb-safe">
              <div className="flex justify-around items-center px-2 py-3 relative">
                <button onClick={() => setView('dashboard')} className={`p-3 flex flex-col items-center transition ${view === 'dashboard' ? 'text-blue-400' : 'text-slate-500 hover:text-slate-300'}`}>
                  <Icons.Home />
                  <span className="text-xs mt-1 font-medium">首頁</span>
                </button>
                <button onClick={() => setView('history')} className={`p-3 flex flex-col items-center transition ${view === 'history' ? 'text-blue-400' : 'text-slate-500 hover:text-slate-300'}`}>
                  <Icons.List />
                  <span className="text-xs mt-1 font-medium">紀錄</span>
                </button>
                
                {/* 中央大按鈕 (Quick Add) */}
                <div className="relative -top-8 flex justify-center w-16">
                  <button onClick={() => setView('add')} className="absolute bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-full shadow-[0_0_20px_rgba(37,99,235,0.4)] transition transform hover:scale-105 active:scale-95">
                    <Icons.Plus />
                  </button>
                </div>

                <button onClick={() => setView('stats')} className={`p-3 flex flex-col items-center transition ${view === 'stats' ? 'text-blue-400' : 'text-slate-500 hover:text-slate-300'}`}>
                  <Icons.Chart />
                  <span className="text-xs mt-1 font-medium">統計</span>
                </button>
                <button onClick={() => setView('settings')} className={`p-3 flex flex-col items-center transition ${view === 'settings' ? 'text-blue-400' : 'text-slate-500 hover:text-slate-300'}`}>
                  <Icons.Settings />
                  <span className="text-xs mt-1 font-medium">設定</span>
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
